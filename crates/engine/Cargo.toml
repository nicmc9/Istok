[package]
name = "engine"
description = "Фасад движка: реэкспортирует подсистемы в одном месте"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
engine_core = { workspace = true }
engine_ecs = { workspace = true }
engine_math = { workspace = true }
engine_platform = { workspace = true }
engine_render = { workspace = true }
engine_net = { workspace = true }
engine_assets = { workspace = true }
engine_scene = { workspace = true }
engine_2d = { workspace = true }
engine_input = { workspace = true }
engine_debug = { workspace = true }
engine_text = { workspace = true }
engine_console = { workspace = true }
engine_serialize = { workspace = true }
engine_physics = { workspace = true, optional = true }
engine_physics_rapier = { workspace = true, optional = true }
engine_audio = { workspace = true, optional = true }
engine_audio_kira = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
# Физики и звука нет: проект подключает их сам (D8). Иначе rapier и kira попадают
# в каждый бинарник, в том числе в неигровой.
default = []
# Звук (kira + cpal). На Linux для сборки нужна ALSA: пакет libasound2-dev.
# Старт ещё и CVar `audio.enabled` — feature только кладёт код в бинарник.
audio = ["dep:engine_audio", "dep:engine_audio_kira"]
# Физика (rapier). Старт — CVar `physics.enabled`.
physics = ["dep:engine_physics", "dep:engine_physics_rapier"]
# Профилирование через Tracy (native) — см. engine_platform::profiling
profiling = ["engine_platform/profiling", "engine_ecs/trace"]
